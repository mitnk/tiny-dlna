[package]
name = "tiny-dlna"
version = "0.15.0"
description = "A tiny DLNA sender & receiver"
license = "MIT"
repository = "https://github.com/mitnk/tiny-dlna"
keywords = ["dlna", "upnp"]
authors = ["mitnk"]
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
env_logger = "0.11.11"
httpdate = "1.0.3"
if-addrs = "0.15.0"
log = "0.4.35"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
tiny_http = "0.12.0"
ureq = { version = "3.5.0", default-features = false }
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.release]
lto = true
strip = true
